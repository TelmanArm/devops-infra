# Deployment: keeps the nopCommerce pod running
apiVersion: apps/v1
kind: Deployment

# Name and namespace
metadata:
  name: nopcommerce
  namespace: demo

spec:
  # Run 1 pod (the disk can't be shared)
  replicas: 1

  # Stop the old pod before starting a new one
  strategy:
    type: Recreate

  # Find the pods that belong to this Deployment
  selector:
    matchLabels:
      app: nopcommerce

  # Pod recipe
  template:
    # Pod label (must match the selector)
    metadata:
      labels:
        app: nopcommerce

    spec:
      # Copies the default App_Data files to the disk.
      # Use "/*", not "/." — BusyBox cp -n skips "/." and copies nothing.
      initContainers:
        - name: copy-app-data
          image: nopcommerceteam/nopcommerce:4.90.8
          command:
            - sh
            - -c
            - |
              set -e
              cp -rn /app/App_Data/* /data/
              echo "App_Data seeded:"
              ls -la /data
          volumeMounts:
            - name: data
              mountPath: /data

      # Main app: nopCommerce on port 80, settings saved on the disk
      containers:
        - name: nopcommerce
          image: nopcommerceteam/nopcommerce:4.90.8
          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi

          # nopCommerce boots slowly, so give it a long startup probe
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5         # the app answers slowly while booting
            failureThreshold: 60      # up to ~5 min
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /app/App_Data

      # Disk: comes from the PVC "nop-data"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nop-data
