apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slowroad
  namespace: argocd         
spec:
  project: default
  source:
    repoURL: https://github.com/TelmanArm/devops-infra.git
    targetRevision: develop  
    path: k8s/overlays/local 
  destination:
    server: https://kubernetes.default.svc   
    namespace: slowroad
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true   